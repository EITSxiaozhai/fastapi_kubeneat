services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kubeneat
      POSTGRES_USER: kubeneat
      POSTGRES_PASSWORD: kubeneat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: public.ecr.aws/bitnami/redis:6.2.13-debian-11-r61
    environment:
      REDIS_PASSWORD: KZNkYLt3U3Zmtm7q
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/bitnami/redis/data

  api:
    build: .
    env_file:
      - .env.container.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8002:8002"
    volumes:
      - kubeneat_runtime:/data/runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]

  celery:
    build: .
    env_file:
      - .env.container.example
    depends_on:
      - postgres
      - redis
    volumes:
      - kubeneat_runtime:/data/runtime
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--pool=solo"]

volumes:
  postgres_data:
  redis_data:
  kubeneat_runtime:
